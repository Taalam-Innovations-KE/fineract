dependencies {
    // NOTE: Fineract platform modules are compileOnly on purpose. They are always
    // present on the application runtime classpath (fineract-provider is the app),
    // so shipping them transitively from a custom module puts a second copy of
    // fineract-core / the fineract-provider -plain jar on the classpath. That
    // duplicates application.properties, which breaks property binding
    // (fineract.mode -> NullPointerException) and Liquibase changelog lookup.
    // Keeping them off runtimeElements is what lets custom/docker/build.gradle and
    // the root build.gradle stay byte-identical to apache/fineract.
    compileOnly(project(':fineract-core'))
    compileOnly(project(':fineract-provider'))
    compileOnly(project(':fineract-security'))
    testImplementation(project(':fineract-core'))
    testImplementation(project(':fineract-provider'))
    testImplementation(project(':fineract-security'))
    implementation(project(':custom:taalam:tenant:runtime'))
    implementation('org.keycloak:keycloak-admin-client:26.0.9')
    implementation('org.springframework.boot:spring-boot-starter-oauth2-resource-server')
    implementation('org.springframework.boot:spring-boot-starter-security')
    implementation('org.springframework.boot:spring-boot-starter-web')
    implementation('org.springframework:spring-tx')
    compileOnly('org.springframework.boot:spring-boot-autoconfigure')
    testImplementation('com.google.code.gson:gson')
}
