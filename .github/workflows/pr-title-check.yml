name: Fineract PR Convention Advisory

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  advise-title:
    name: Check PR title convention
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title="$PR_TITLE"
          conventional_regex="^(revert: )?(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([A-Za-z0-9._/-]+\))?!?: .+"
          jira_regex="[A-Z][A-Z0-9]+-[0-9]+"

          if [[ ! "$title" =~ $conventional_regex ]]; then
            echo "::warning::PR title '$title' does not follow the conventional commit style."
            echo "::warning::Expected examples: 'feat(auth): add keycloak provisioning' or 'fix(ci): gate sonar by configuration'."
          else
            echo "Success: PR title follows the conventional commit style."
          fi

          if [[ ! "$title" =~ $jira_regex ]]; then
            echo "::notice::No Jira work item key found in the PR title. Include a key like 'ABC-123' to link this PR to Jira."
          else
            echo "Success: PR title includes a Jira work item key."
          fi
