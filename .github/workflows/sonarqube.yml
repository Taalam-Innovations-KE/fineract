name: Fineract Sonarqube
on:
  workflow_call:
    inputs:
      sonar-organization:
        required: false
        type: string
      sonar-project-key:
        required: false
        type: string
      sonar-host-url:
        required: false
        type: string
    secrets:
      SONARCLOUD_TOKEN:
        required: false
      DEVELOCITY_ACCESS_KEY:
        required: false
permissions:
  contents: read
jobs:
  build:
    if: >-
      ${{
        github.event_name == 'push' &&
        (
          github.ref_name == 'develop' ||
          startsWith(github.ref_name, 'release/') ||
          startsWith(github.ref_name, '1.')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
        TZ: Asia/Kolkata
        SONAR_ORGANIZATION: ${{ inputs.sonar-organization }}
        SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        JAVA_BINARIES: .
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Download workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fineract-workspace-${{ github.run_id }}
          path: .
      - name: Extract workspace
        run: tar -xf fineract-workspace.tar
      - name: Setup Gradle and Validate Wrapper
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          validate-wrappers: true
      - name: Validate SonarQube configuration
        run: |
          missing=0
          for name in SONAR_ORGANIZATION SONAR_PROJECT_KEY SONAR_HOST_URL SONAR_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required when ENABLE_SONARQUBE is true."
              missing=1
            fi
          done
          exit "$missing"
      - name: Sonar
        run: ./gradlew --no-daemon --console=plain -Dsonar.verbose=true -Dsonar.token=$SONAR_TOKEN -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.organization=$SONAR_ORGANIZATION -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.java.binaries=$JAVA_BINARIES --info --stacktrace sonar -x buildJavaSdk
