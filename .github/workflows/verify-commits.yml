name: Fineract Signed Commits Check

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref to compare against
        required: false
        default: develop
        type: string
      head_ref:
        description: Head ref or SHA to verify
        required: false
        default: HEAD
        type: string
      strict:
        description: Fail if unsigned commits are found
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-signatures:
    name: Verify Commit Signatures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: git fetch origin "$BASE_REF"

      - name: Verify signatures
        env:
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
          STRICT: ${{ inputs.strict }}
        run: |
          chmod +x scripts/verify-signed-commits.sh
          args=(
            --base-ref "origin/$BASE_REF" \
            --head-ref "$HEAD_REF"
          )
          if [ "$STRICT" = "true" ]; then
            args+=(--strict)
          fi
          ./scripts/verify-signed-commits.sh "${args[@]}"
