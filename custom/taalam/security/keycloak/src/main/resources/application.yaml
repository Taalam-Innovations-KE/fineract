fineract:
  security:
    oauth2:
      external:
        enabled: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_ENABLED:false}
        keycloak-base-url: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_KEYCLOAK_BASE_URL:}
        audience: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_AUDIENCE:fineract}
        username-claim: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_USERNAME_CLAIM:preferred_username}
        email-claim: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_EMAIL_CLAIM:email}
        require-email-match: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_REQUIRE_EMAIL_MATCH:true}
        service-client-claim: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_SERVICE_CLIENT_CLAIM:azp}
        service-user-prefix: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_SERVICE_USER_PREFIX:svc-}
        provisioning:
          enabled: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_PROVISIONING_ENABLED:false}
          admin-realm: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_PROVISIONING_ADMIN_REALM:master}
          admin-client-id: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_PROVISIONING_ADMIN_CLIENT_ID:}
          admin-client-secret: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_PROVISIONING_ADMIN_CLIENT_SECRET:}
          user-enabled: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_PROVISIONING_USER_ENABLED:true}
          email-verified: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_PROVISIONING_EMAIL_VERIFIED:false}
          send-actions-email: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_PROVISIONING_SEND_ACTIONS_EMAIL:true}
          actions-email-lifespan-seconds: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_PROVISIONING_ACTIONS_EMAIL_LIFESPAN_SECONDS:43200}
          sync-username-on-email-match: ${FINERACT_SECURITY_OAUTH2_EXTERNAL_PROVISIONING_SYNC_USERNAME_ON_EMAIL_MATCH:true}
          required-actions:
            - UPDATE_PASSWORD
